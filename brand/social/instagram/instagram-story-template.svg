<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="Ascend Lettings Instagram story template">
  <title>Ascend Lettings — Instagram Story Template</title>
  <rect width="1080" height="1920" fill="#0B1F3A"/>
  <!-- Large gold icon top-centre -->
  <g transform="translate(450,240) scale(1.8)" fill="#C9A84C">
    <polygon points="8,88 8,64 24,58 24,88"/>
    <polygon points="36,88 36,44 52,38 52,88"/>
    <polygon points="64,88 64,22 80,16 80,88"/>
  </g>
  <text x="540" y="520" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="66" font-weight="700" fill="#FFFFFF">Ascend</text>
  <text x="540" y="578" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="30" font-weight="500" letter-spacing="14" fill="#C9A84C">LETTINGS</text>
  <!-- Content area middle -->
  <rect x="120" y="720" width="840" height="600" rx="24" fill="#F7F5F2"/>
  <text x="540" y="1000" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="60" font-weight="700" fill="#0B1F3A">[ Story Headline ]</text>
  <text x="540" y="1080" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="32" font-weight="400" fill="#4A5568">Your message goes here</text>
  <rect x="440" y="1140" width="200" height="6" rx="3" fill="#C9A84C"/>
  <!-- URL bottom -->
  <rect x="0" y="1780" width="1080" height="140" fill="#C9A84C"/>
  <text x="540" y="1868" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="4" fill="#0B1F3A">www.ascendlettings.co.uk</text>
</svg>
