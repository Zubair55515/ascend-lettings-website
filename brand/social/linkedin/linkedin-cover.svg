<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396" role="img" aria-label="Ascend Lettings LinkedIn cover">
  <title>Ascend Lettings — LinkedIn Cover</title>
  <defs>
    <linearGradient id="lnavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#12294D"/>
    </linearGradient>
  </defs>
  <rect width="1584" height="396" fill="url(#lnavy)"/>
  <rect x="0" y="0" width="10" height="396" fill="#C9A84C"/>
  <!-- White logo left -->
  <g transform="translate(130,120) scale(1.4)" fill="#FFFFFF">
    <polygon points="8,88 8,64 24,58 24,88"/>
    <polygon points="36,88 36,44 52,38 52,88"/>
    <polygon points="64,88 64,22 80,16 80,88"/>
  </g>
  <text x="290" y="185" font-family="'Playfair Display', Georgia, serif" font-size="60" font-weight="700" fill="#FFFFFF">Ascend</text>
  <text x="292" y="235" font-family="'Inter', Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="12" fill="#C9A84C">LETTINGS</text>
  <!-- Tagline right in Inter -->
  <text x="1454" y="180" text-anchor="end" font-family="'Inter', Arial, sans-serif" font-size="40" font-weight="600" fill="#FFFFFF">Professional Property Letting</text>
  <text x="1454" y="235" text-anchor="end" font-family="'Inter', Arial, sans-serif" font-size="40" font-weight="600" fill="#C9A84C">Made Simple</text>
  <text x="1454" y="300" text-anchor="end" font-family="'Inter', Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="2" fill="#F7F5F2">www.ascendlettings.co.uk</text>
