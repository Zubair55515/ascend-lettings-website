<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600" role="img" aria-label="Ascend Lettings business card front">
  <title>Ascend Lettings — Business Card Front</title>
  <rect width="1050" height="600" fill="#0B1F3A"/>
  <!-- Ascending gold icon top-left -->
  <g transform="translate(80,70) scale(1.15)" fill="#C9A84C">
    <polygon points="8,88 8,64 24,58 24,88"/>
    <polygon points="36,88 36,44 52,38 52,88"/>
    <polygon points="64,88 64,22 80,16 80,88"/>
  </g>
  <!-- Wordmark -->
  <text x="80" y="290" font-family="'Playfair Display', Georgia, serif" font-size="62" font-weight="700" fill="#FFFFFF">Ascend</text>
  <text x="84" y="330" font-family="'Inter', Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="10" fill="#C9A84C">LETTINGS</text>
  <!-- Thin gold divider -->
  <rect x="80" y="380" width="380" height="3" fill="#C9A84C"/>
  <!-- Name / title placeholders -->
  <text x="80" y="450" font-family="'Inter', Arial, sans-serif" font-size="40" font-weight="600" fill="#FFFFFF">[Your Name]</text>
  <text x="80" y="500" font-family="'Inter', Arial, sans-serif" font-size="28" font-weight="400" fill="#C9A84C">[Your Title]</text>
</svg>
